name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: olivergw/nginx-custom

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Nginx image tags
        id: nginx_version
        run: |
          NGINX_TAG=$(awk '$1 == "FROM" && $2 ~ /^nginx:/ { sub(/^nginx:/, "", $2); print $2; exit }' Dockerfile)
          NGINX_VERSION="${NGINX_TAG%%-*}"
          NGINX_VARIANT="${NGINX_TAG#*-}"
          echo "tag=${NGINX_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NGINX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${NGINX_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${NGINX_VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "variant=${NGINX_VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.nginx_version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=mainline,enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.major }},enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.tag }},enable={{is_default_branch}}
            type=raw,value=mainline-${{ steps.nginx_version.outputs.variant }},enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.major }}-${{ steps.nginx_version.outputs.variant }},enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.minor }}-${{ steps.nginx_version.outputs.variant }},enable={{is_default_branch}}
            type=raw,value=${{ steps.nginx_version.outputs.variant }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
